---
# Lab inventory — run concepts on localhost without extra VMs.
# Swap ansible_connection to ssh and set ansible_host when you have real nodes.
all:
  children:
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    web:
      hosts:
        web1:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    db:
      hosts:
        db1:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    docker:
      hosts:
        web1:
