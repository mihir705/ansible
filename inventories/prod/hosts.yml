---
# Production-style SSH inventory. Copy hosts and fill in real IPs/DNS.
all:
  children:
    web:
      hosts:
        web1:
          ansible_host: 10.0.1.11
          ansible_user: ubuntu
        web2:
          ansible_host: 10.0.1.12
          ansible_user: ubuntu
    db:
      hosts:
        db1:
          ansible_host: 10.0.2.11
          ansible_user: ubuntu
    docker:
      children:
        web:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
